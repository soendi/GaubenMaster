name: GaubenMaster CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

env:
  PRODUCT_NAME: GaubenMaster
  GITHUB_REPO: soendi/GaubenMaster

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black mypy
    
    - name: Run linting (flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check formatting (black)
      run: |
        black --check --diff .
    
    - name: Type checking (mypy)
      continue-on-error: true
      run: |
        mypy . --ignore-missing-imports --explicit-package-bases
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  build:
    name: Build Package
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'push'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: pypi
    permissions:
      id-token: write
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Publish to PyPI
      if: env.PYPI_API_TOKEN != ''
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}

  build-windows:
    name: Build Windows Installer & Portable
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Extract version
      id: version
      run: |
        $content = Get-Content version.json -Raw | ConvertFrom-Json
        echo "version=$($content.version)" >> $env:GITHUB_OUTPUT
    
    - name: Build portable executable with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "${{ env.PRODUCT_NAME }}" `
          --add-data "version.json;." `
          --add-data "LICENSE;." `
          --icon "assets/icon.ico" `
          main.py
      shell: pwsh
    
    - name: Verify executable
      run: |
        .\dist\${{ env.PRODUCT_NAME }}.exe --version 2>&1 || echo "Version check skipped (GUI app)"
      shell: pwsh
    
    - name: Install NSIS
      run: |
        choco install nsis --version=3.09 --no-progress
      shell: pwsh
    
    - name: Build NSIS Installer
      continue-on-error: true
      run: |
        makensis /DPRODUCT_VERSION="${{ steps.version.outputs.version }}" installer.nsi
      shell: cmd
    
    - name: Rename installer with version
      continue-on-error: true
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $installer = "GaubenMaster-Setup-$version.exe"
        if (Test-Path "GaubenMaster-Setup-${{ steps.version.outputs.version }}.exe") {
          Move-Item "GaubenMaster-Setup-${{ steps.version.outputs.version }}.exe" $installer
          echo "installer=$installer" >> $env:GITHUB_OUTPUT
        }
      id: installer
      shell: pwsh
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GaubenMaster-windows-${{ steps.version.outputs.version }}
        path: |
          dist/${{ env.PRODUCT_NAME }}.exe
          ${{ steps.installer.outputs.installer }}
        retention-days: 30

  create-release:
    name: Create GitHub Release Assets
    needs: [build-windows, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write

    steps:
    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: GaubenMaster-windows-${{ github.event.release.tag_name }}
        path: release-assets/

    - name: Download PyPI package artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: release-assets/
    
    - name: List release assets
      run: ls -la release-assets/
    
    - name: Upload assets to release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-assets/GaubenMaster-Setup-*.exe
          release-assets/GaubenMaster.exe
          release-assets/*.tar.gz
          release-assets/*.whl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Extract version
      id: version
      run: |
        VERSION=$(grep '"version"' version.json | cut -d'"' -f4)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Build and push Docker image
      if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/gaubenmaster:${{ steps.version.outputs.version }}
          ${{ secrets.DOCKERHUB_USERNAME }}/gaubenmaster:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max